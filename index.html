  padding:2px 8px; background:rgba(255,255,255,.04)}

/* ---------- مكوّنات 2030 ---------- */
.brief{background:linear-gradient(150deg, rgba(34,211,238,.14), rgba(139,92,246,.12) 70%, rgba(255,255,255,.03));
  border:1px solid rgba(34,211,238,.28)}

.b-alert{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px}

<script>
/* ================= مائي — نظام إدارة بيع الوحدة ================= */
const LS_KEY = 'maai_units_v1';
const DEFAULT_TIERS = [10,15,20,30,40,50,80,100];

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function today(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function nf(n){ return new Intl.NumberFormat('en-US',{maximumFractionDigits:2}).format(Number(n)||0); }
function money(n){ return nf(n)+' ريال'; }

let storageError = '';
let S = load();

function readEncryptedState(){
  const response = JSON.parse(window.MaaiNative.loadEncryptedData());
  if(!response || response.ok!==true) throw new Error('تعذرت قراءة البيانات المحمية');
  return response.data;
}
function writeEncryptedState(value){
  const response = JSON.parse(window.MaaiNative.saveEncryptedData(value));
  if(!response || response.ok!==true) throw new Error('تعذرت كتابة البيانات المحمية');
}
function load(){
  const native = window.MaaiNative;
  if(native && native.loadEncryptedData && native.saveEncryptedData){
    try{
      const protectedData = readEncryptedState();
      if(protectedData!==null){
        localStorage.removeItem(LS_KEY);
        return normalize(JSON.parse(protectedData));
      }
      const legacyData = localStorage.getItem(LS_KEY);
      if(legacyData!==null){
        const migrated = normalize(JSON.parse(legacyData));
        writeEncryptedState(JSON.stringify(migrated));
        localStorage.removeItem(LS_KEY);
        return migrated;
      }
      return normalize({});
    }catch(e){
      storageError = 'تعذر فك تشفير بيانات التطبيق أو تهيئتها. استعد نسخة احتياطية لاسترجاع بياناتك.';
      return normalize({});
    }
  }
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); return normalize(d); }
  }catch(e){}
  return normalize({});
}
function normalize(d){
  d = d || {};
  d.settings = Object.assign({
    businessName:'مائي | MA2I',
    owner:'',
    unitPrice:800,
    currency:'ريال',
    tiers: DEFAULT_TIERS.slice(),
    theme:'dark',
    monthGoal:0,
    pin:''
  }, d.settings||{});
  d.version = 3;
  d.customers = Array.isArray(d.customers)? d.customers : [];
  d.tx = Array.isArray(d.tx)? d.tx : [];
  d.expenses = Array.isArray(d.expenses)? d.expenses : [];
  // سجل التذكيرات: { 'YYYY-MM-DD': [customerId, ...] } — نُبقي آخر ٩٠ يوم فقط
  if(!d.reminders || typeof d.reminders!=='object' || Array.isArray(d.reminders)) d.reminders = {};
  const cutoff = new Date(Date.now() - 90*86400000);
  Object.keys(d.reminders).forEach(k=>{ if(new Date(k+'T00:00:00') < cutoff) delete d.reminders[k]; });
  // ضمان وجود معرّف وتاريخ إنشاء لكل سجل (نسخ قديمة/مستوردة بلا id لا يمكن تعديلها أو حذفها)
  d.customers.forEach(c=>{ if(c && !c.id) c.id = uid(); });
  d.tx.forEach(t=>{ if(t && !t.id) t.id = uid(); if(t && t.created===undefined) t.created = 0; });
  d.expenses.forEach(e=>{ if(e && !e.id) e.id = uid(); if(e && e.created===undefined) e.created = 0; });
  return d;
}
function save(){
  if(storageError){ toast('البيانات محمية من التغيير — استعد نسخة احتياطية أولاً'); return false; }
  const native = window.MaaiNative;
  if(native && native.saveEncryptedData){
    try{
      writeEncryptedState(JSON.stringify(S));
      localStorage.removeItem(LS_KEY);
      return true;
    }catch(e){ toast('تعذر حفظ البيانات المحمية — لم يُحفظ التغيير'); return false; }
  }
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); return true; }
  catch(e){ toast('تعذر الحفظ على هذا الجهاز'); return false; }
}

/* ---------- حسابات ---------- */
function cust(id){ return S.customers.find(c=>c.id===id); }
function txOf(id){ return S.tx.filter(t=>t.customerId===id).sort((a,b)=> (a.date<b.date?-1:1) || (a.created>b.created?1:-1)); }
function totalsOf(id){
  let units=0, sales=0, paid=0, loads=0;
  S.tx.forEach(t=>{
    if(t.customerId!==id) return;
    if(t.type==='sale'){ units += Number(t.units)||0; sales += Number(t.amount)||0; paid += Number(t.paid)||0; loads++; }
    else { paid += Number(t.amount)||0; }
  });
  return { units, sales, paid, due: sales-paid, loads };
}
function grand(){
  let units=0, sales=0, paid=0, loads=0;
  S.tx.forEach(t=>{
    if(t.type==='sale'){ units += Number(t.units)||0; sales += Number(t.amount)||0; paid += Number(t.paid)||0; loads++; }
    else { paid += Number(t.amount)||0; }
  });
  const expenses = (S.expenses||[]).reduce((s,e)=> s + (Number(e.amount)||0), 0);
  return { units, sales, paid, due: sales-paid, customers:S.customers.length, loads, expenses, net: paid-expenses };
}
function dueOf(id){ const t=totalsOf(id); return t.due; }
/* ---------- صندوق اليوم ---------- */
function cashOf(day){
  let sales=0, coll=0, units=0;
  S.tx.forEach(t=>{
    if(t.date!==day) return;
    if(t.type==='sale'){ sales += Number(t.amount)||0; coll += Number(t.paid)||0; units += Number(t.units)||0; }
    else { coll += Number(t.amount)||0; }
  });
  const exp = (S.expenses||[]).filter(e=>e.date===day).reduce((s,e)=> s + (Number(e.amount)||0), 0);
  return { day, sales, coll, units, exp, net: coll-exp };
}
function todayCash(){ return cashOf(today()); }
function expensesOf(){ return (S.expenses||[]).slice().sort((a,b)=> a.date<b.date?1:-1); }
function expTotal(list){ return (list||[]).reduce((s,e)=> s + (Number(e.amount)||0), 0); }
/* ---------- فلترة بالفترة ---------- */
let fromD='', toD='';
function inRange(d){ if(fromD && d<fromD) return false; if(toD && d>toD) return false; return true; }
function rangeTx(){ return S.tx.filter(t=>inRange(t.date)); }
function rangeExp(){ return expensesOf().filter(e=>inRange(e.date)); }
function rangeTotals(){
  let units=0, sales=0, paid=0;
  rangeTx().forEach(t=>{
    if(t.type==='sale'){ units += Number(t.units)||0; sales += Number(t.amount)||0; paid += Number(t.paid)||0; }
    else { paid += Number(t.amount)||0; }
  });
  const expenses = expTotal(rangeExp());
  return { units, sales, paid, due: sales-paid, expenses, net: paid-expenses };
}

/* ---------- أدوات واجهة ---------- */
function toast(msg){
  const el = document.querySelector('#toast span');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 1900);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function pillFor(due){
  if(due>0.5) return '<span class="pill due">عليه '+nf(due)+'</span>';
  if(due<-0.5) return '<span class="pill ok">له '+nf(-due)+'</span>';
  return '<span class="pill none">مسدد</span>';
}
function backLink(){ return '<button class="btn ghost no-print" style="margin-bottom:12px" onclick="history.back()">‹ رجوع</button>'; }
function daysSince(dstr){ if(!dstr) return null; const d=new Date(dstr+'T00:00:00'); if(isNaN(d)) return null; return Math.floor((Date.now()-d.getTime())/86400000); }
function backupHint(){
  const last = S.settings.lastBackup || '';
  const n = daysSince(last);
  if(n!==null && n<7) return '';
  return `<div class="note-area warn no-print">
    <div class="tiny" style="font-weight:800">تنبيه: نسخة احتياطية</div>
    <div class="tiny" style="margin-top:4px">${last? 'آخر نسخة قبل '+nf(n)+' يوم.' : 'لم تأخذ نسخة احتياطية بعد.'} بياناتك محفوظة على هذا الجهاز فقط — خُذ نسخة من الإعدادات وأرسلها لنفسك على واتساب.</div>
    <button class="btn alt" style="margin-top:8px" onclick="location.hash='#/settings'">فتح الإعدادات والنسخ</button>
  </div>`;
}

/* ---------- التذكير بالجوال / واتساب ---------- */
function waPhone(p){
  let d = String(p||'').replace(/\D/g,'');
  if(!d) return '';
  if(d.indexOf('00')===0) d = d.slice(2);
  if(d.indexOf('967')===0) return d;
  if(d.charAt(0)==='0') d = d.slice(1);
  if(d.length===9 && d.charAt(0)==='7') return '967'+d;
  return d;
}
function fmtPhone(p){ const d = waPhone(p); return d? '+'+d : ''; }
function reminderText(c){
  const t = totalsOf(c.id);
  const biz = S.settings.businessName || 'مائي';
  return `مرحباً ${c.name}،\nتذكير ودّي من ${biz}:\nالوحدات: ${nf(t.units)}\nإجمالي المبيعات: ${nf(t.sales)} ريال\nالمدفوع: ${nf(t.paid)} ريال\nالمتبقي: ${nf(t.due)} ريال\nشكراً لتعاملك معنا 💧`;
}
function debtorsList(){
  return S.customers.map(c=>({c, t:totalsOf(c.id)})).filter(x=>x.t.due>0.5).sort((a,b)=> b.t.due - a.t.due);
}
/* ---------- تقادم الديون: تخصيص الدفعات على أقدم بيع (FIFO) ---------- */
function agingOf(id){
  const queue = [];
  txOf(id).forEach(t=>{
    if(t.type==='sale'){
      const left = (Number(t.amount)||0) - (Number(t.paid)||0);
      if(left>0.5) queue.push({date:t.date, left:left});
    } else {
      let pay = Number(t.amount)||0;
      while(pay>0.5 && queue.length){
        const q = queue[0];
        const use = Math.min(q.left, pay);
        q.left -= use; pay -= use;
        if(q.left<=0.5) queue.shift();
      }
    }
  });
  const oldest = queue.length? queue[0].date : '';
  let over30 = 0, over60 = 0;
  queue.forEach(q=>{ const d = daysSince(q.date)||0; if(d>30) over30 += q.left; if(d>60) over60 += q.left; });
  return { oldest:oldest, days: oldest? daysSince(oldest) : null, over30:over30, over60:over60 };
}
/* ---------- السعر الخاص لكل عميل (3.0) ----------
   العميل ممكن يكون متفق معه على سعر غير سعر الوحدة العام؛ نطبّقه تلقائياً في شاشة البيع. */
function specialPriceOf(id){
  const c = cust(id);
  const p = c? Number(c.price)||0 : 0;
  return p>0? p : 0;
}

const AR_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function mKey(d){ return String(d||'').slice(0,7); }
function monthLabel(k){ const p = String(k||'').split('-'); const y = p[0], m = Number(p[1])||0; return (AR_MONTHS[m-1] || k) + ' ' + y; }
function monthRange(k){
  const p = String(k||'').split('-'); const y = Number(p[0]), m = Number(p[1]);
  if(!y || !m) return ['',''];
  const mm = String(m).padStart(2,'0');
  const last = new Date(y, m, 0).getDate();
  return [y+'-'+mm+'-01', y+'-'+mm+'-'+String(last).padStart(2,'0')];
}
function monthsList(){
  const map = {};
  const get = k => (map[k] = map[k] || {key:k, units:0, sales:0, paid:0, expenses:0, loads:0});
  S.tx.forEach(t=>{
    const k = mKey(t.date); if(!k) return; const m = get(k);
    if(t.type==='sale'){ m.units += Number(t.units)||0; m.sales += Number(t.amount)||0; m.paid += Number(t.paid)||0; m.loads++; }
    else { m.paid += Number(t.amount)||0; }

  (S.expenses||[]).forEach(e=>{ const k = mKey(e.date); if(k) get(k).expenses += Number(e.amount)||0; });

/* ---------- قفل بكلمة سر (3.0) ----------
   حماية بصرية على الجهاز: تمنع من يحمل الجوال من فتح ديون العملاء.
   الرقم يُحفظ بصمةً (hash) لا نصاً صريحاً، لكن البيانات نفسها على الجهاز — القفل ساتر لا تشفير. */
function pinHash(pin){
  const s = 'maai|' + String(pin||'');
  let h = 5381;
  for(let i=0;i<s.length;i++) h = ((h<<5) + h + s.charCodeAt(i)) | 0;
  return 'h' + (h>>>0).toString(36);
}
function hasPin(){ return !!(S.settings && S.settings.pin); }
let locked = false, hiddenAt = 0;
function showLock(){
  locked = true;
  const el = document.getElementById('lock'); if(el) el.classList.remove('hidden');
  const i = document.getElementById('lockPin');
  if(i){ i.value=''; setTimeout(()=>{ try{ i.focus(); }catch(e){} }, 140); }
}
function hideLock(){ locked = false; const el = document.getElementById('lock'); if(el) el.classList.add('hidden'); }
function lockNow(){
  if(!hasPin()){ toast('حدّد رقماً سرياً أولاً من الإعدادات'); location.hash='#/settings'; renderSettings(); return; }
  closeModal(); showLock();
}
function tryUnlock(){
  const el = document.getElementById('lockPin');
  const v = String((el && el.value) || '').trim();
  const e = document.getElementById('lockErr');
  const fail = (msg)=>{ if(e){ e.className='modal-err'; e.style.display='block'; e.textContent = msg; } };
  if(!v){ fail('أدخل الرقم السري'); return; }
  if(pinHash(v) === S.settings.pin){
    if(e) e.style.display='none';
    hideLock(); buzz(14); toast('أهلاً بك 🌙');
    return;
  }
  fail('الرقم غير صحيح');
  if(el){ el.value=''; try{ el.focus(); }catch(x){} }
  buzz(40);
}
function removePin(){
  openConfirm('إلغاء القفل', 'إلغاء الرقم السري؟ سيصبح التطبيق مفتوحاً لأي شخص يحمل الجوال.', ()=>{
    S.settings.pin = ''; save(); toast('تم إلغاء القفل'); renderSettings();
  }, 'نعم، ألغِ القفل');
}
function initLock(){
  if(hasPin()) showLock(); else hideLock();
  if(document.addEventListener){
    document.addEventListener('visibilitychange', ()=>{
      if(document.hidden){ hiddenAt = Date.now(); }
      else if(hiddenAt && (Date.now()-hiddenAt) > 60000 && hasPin()){ hiddenAt = 0; showLock(); }
    });
  }
}

function _modalFields(fields){

/* رسم أعمدة: مبيعات مقابل محصَّل، شهر لكل عمود */
function barChart(series){
  if(!series || !series.length) return '';
  const W=340, H=158, P=20;
  const max = Math.max(1, ...series.map(s=>Math.max(Number(s.sales)||0, Number(s.paid)||0)));
  const slot = (W-2*P)/series.length, bw = Math.min(16, slot*0.30);
  let bars='';
  series.forEach((s,i)=>{
    const cx = P + slot*i + slot/2;
    const hs = (H-2*P)*((Number(s.sales)||0)/max);
    const hp = (H-2*P)*((Number(s.paid)||0)/max);
    bars += `<rect x="${(cx-bw-2).toFixed(1)}" y="${(H-P-hs).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.6,hs).toFixed(1)}" rx="4" style="fill:#22d3ee" opacity=".85"/>`;
    bars += `<rect x="${(cx+2).toFixed(1)}" y="${(H-P-hp).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0.6,hp).toFixed(1)}" rx="4" style="fill:#2dd4bf"/>`;
    bars += `<text x="${cx.toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="9" style="fill:var(--mut)">${esc(shortMonth(s.key))}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${bars}</svg>`;
}
/* حلقة نسبة مئوية */
function donutPct(pct, color){
  const p = Math.max(0, Math.min(100, Math.round(Number(pct)||0)));
  const r = 42, c = 2*Math.PI*r, off = c*(1-p/100);
  return `<svg viewBox="0 0 120 120" class="donut" role="img">
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="12"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${color||'#22d3ee'}" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 60 60)"/>
    <text x="60" y="67" text-anchor="middle" font-size="21" font-weight="800" style="fill:var(--ink)">${p}%</text>
  </svg>`;
}
/* أشرطة أفقية (مصروفات حسب البند، أفضل العملاء) */
function hbars(items, color){
  if(!items || !items.length) return '<div class="empty">لا بيانات</div>';
  const max = Math.max(1, ...items.map(i=>Number(i.v)||0));

    <div class="hb"><i style="width:${Math.max(2,(Number(i.v)||0)/max*100).toFixed(1)}%;background:${color||'linear-gradient(90deg,#22d3ee,#8b5cf6)'}"></i></div>
  </div>`).join('');
}

/* فلاتر فترة سريعة */
function quickRange(kind){
  const d = new Date(); const iso = x => new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10);
  const startOfMonth = new Date(d.getFullYear(), d.getMonth(), 1);
  const startPrev = new Date(d.getFullYear(), d.getMonth()-1, 1);
  const endPrev = new Date(d.getFullYear(), d.getMonth(), 0);
  if(kind==='today'){ fromD = today(); toD = today(); }
  else if(kind==='week'){ const s=new Date(d.getTime()-6*86400000); fromD=iso(s); toD=iso(d); }
  else if(kind==='month'){ fromD = iso(startOfMonth); toD = iso(d); }
  else if(kind==='prev'){ fromD = iso(startPrev); toD = iso(endPrev); }
  else if(kind==='d30'){ const s=new Date(d.getTime()-29*86400000); fromD=iso(s); toD=iso(d); }
  else { fromD=''; toD=''; }
  renderReports();
}
function quickChips(){
  const chips = [['today','اليوم'],['week','٧ أيام'],['month','هذا الشهر'],['prev','الشهر الماضي'],['d30','٣٠ يوم'],['all','الكل']];
  return `<div class="chips no-print" style="margin-top:8px">${chips.map(c=>
    `<button class="chip" onclick="quickRange('${c[0]}')">${c[1]}</button>`).join('')}</div>`;
}
/* الملخص الذكي على اللوحة */
function briefAlerts(){
  const out = [];
  const dl = debtorsList();
  if(dl.length){
    const t0 = dl[0];
    out.push({tone:'bad', ic:'⚑', text:`أكبر مدين: <b>${esc(t0.c.name)}</b> — ${money(t0.t.due)}`,
      label:'فتح', act:`location.hash='#/customer/${t0.c.id}'`});
  }
  let ov60=0, n60=0;
  S.customers.forEach(c=>{ const a = agingOf(c.id); if(a.over60>0.5){ ov60 += a.over60; n60++; } });
  if(ov60>0.5) out.push({tone:'warn', ic:'⏳', text:`${money(ov60)} متأخرة أكثر من 60 يوم (${nf(n60)} عميل)`,
    label:'متابعة', act:`repTab='debts';location.hash='#/reports';renderReports()`});
  const chl = chasePending();
  if(chl.length) out.push({tone:'warn', ic:'🔔', text:`${nf(chl.length)} عميل بانتظار تذكير اليوم — ${money(chl.reduce((s,x)=>s+x.t.due,0))}`,
    label:'القائمة', act:`location.hash='#/chase'`});
  const tc = todayCash();
  out.push({tone:'good', ic:'💧', text:`صندوق اليوم: <b>${money(tc.net)}</b> صافي · ${nf(tc.units)} وحدة`,
    label:'', act:''});
  const last = S.settings.lastBackup? daysSince(S.settings.lastBackup) : null;
  if(last===null || last>=7) out.push({tone:'warn', ic:'🛡', label:'نسخ',
    text: (last===null? 'لا نسخة احتياطية بعد — بياناتك محفوظة على هذا الجهاز فقط.' : `آخر نسخة احتياطية قبل ${nf(last)} يوم.`),
    act:`location.hash='#/settings'`});
  return out;
}
function briefHtml(){
  const rows = briefAlerts().map(a=>`<div class="b-alert ${a.tone}">
      <span class="ic">${a.ic}</span>
      <span class="t">${a.text}</span>
      ${a.act? `<button class="btn ${a.tone==='good'?'alt':'ghost'}" style="width:auto;margin:0;padding:5px 11px;font-size:11.5px;border-radius:10px" onclick="${a.act}">${a.label}</button>`:''}
    </div>`).join('');
  return `<div class="card brief no-print">
    <div class="row between" style="margin-bottom:4px">
      <div><div class="bt">مساعد مائي</div><div class="tiny">نظرة ذكية على يومك</div></div>
      <span class="pill ok">النسخة ${VERSION}</span>
    </div>${rows}</div>`;
}

/* ---------- قائمة «ذكّر اليوم» ---------- */
function renderChase(){
  setHead('ذكّر اليوم','قائمة المتابعة والتحصيل');
  const all = chaseList();
  const todo = all.filter(x=>!x.done);
  const done = all.filter(x=>x.done);
  const dueTodo = todo.reduce((s,x)=> s + x.t.due, 0);
  const row = x=>{
    const c = x.c, days = x.ag.days;
    const ageTxt = days===null? '—' : nf(days)+' يوم';
    const ageTone = (days!==null && days>60)? 'var(--bad)' : (days!==null && days>30? 'var(--warn)' : 'var(--mut)');
    const lr = lastRemindOf(c.id);
    return `<div class="list-item" style="cursor:default">
      <div class="avatar ${x.done?'':'neg'}">${x.done? '✅' : esc((c.name||'؟').trim().charAt(0))}</div>
      <div class="li-main" onclick="location.hash='#/customer/${c.id}'">
        <div class="li-name">${esc(c.name)}</div>
        <div class="li-sub">${money(x.t.due)} · أقدم دين <b style="color:${ageTone}">${ageTxt}</b>${lr? ' · آخر تذكير '+esc(lr) : ''}</div>
      </div>
      <div class="li-amt" style="display:flex;gap:5px">
        <button class="btn" style="margin:0;padding:6px 10px;font-size:12px;border-radius:10px" onclick="chaseRemind('${c.id}')">💬</button>
        <button class="btn alt" style="margin:0;padding:6px 9px;font-size:12px;border-radius:10px" onclick="toggleReminded('${c.id}')">${x.done? '↩':'تم'}</button>
      </div>
    </div>`;
  };
  document.getElementById('app').innerHTML = `
  ${backLink()}
  <div class="card" style="text-align:center">
    <div class="mut">المطلوب تذكيرهم اليوم</div>
    <div style="font-size:26px;font-weight:800">${nf(todo.length)} <span style="font-size:14px">عميل</span></div>
    <div class="tiny">${nf(dueTodo)} ريال بانتظار التحصيل${done.length? ' · تم تذكير '+nf(done.length)+' اليوم':''}</div>
  </div>
  <h2 class="sec" style="margin-top:6px">الأولوية: الأقدم ديناً أولاً</h2>
  <div class="card" style="padding:4px 10px">${todo.length? todo.map(row).join('') : '<div class="empty">ما بقي أحد — كل المتأخرين تم تذكيرهم اليوم ✅</div>'}</div>
  ${done.length? `<h2 class="sec" style="margin-top:14px">تم تذكيرهم اليوم (${nf(done.length)})</h2>
    <div class="card" style="padding:4px 10px">${done.map(row).join('')}</div>`:''}
  <div class="tiny no-print" style="margin:8px 2px 20px">«تم» تعلّم العميل كمذكَّر اليوم فقط ولا تنقص من دينه، وفتح واتساب يعلّمه تلقائياً. القائمة تُبنى من الديون: الأقدم أولاً ثم الأكبر.</div>`;
}

function newCustomerOnly(){
  openForm('عميل جديد', [
    {key:'name', label:'اسم العميل', placeholder:'مثال: محمد خام'},
    {key:'phone', label:'رقم الجوال (اختياري)', type:'tel', placeholder:'7xxxxxxx'},
    {key:'price', label:'سعر خاص للوحدة (اختياري — 0 أو فارغ = السعر العام)', type:'number', placeholder:String(S.settings.unitPrice)}
  ], v=>{
    const name = (v.name||'').trim();

    S.customers.push({id:uid(), name, phone:(v.phone||'').trim(), price:Math.max(0, Number(v.price)||0), createdAt:Date.now()});
    save(); toast('تم إضافة العميل ✅'); searchQ=''; location.hash='#/customers'; renderCustomers();
  }, 'إضافة العميل');
}

function delTx(id){
  const t = S.tx.find(x=>x.id===id); if(!t) return;
  const c = cust(t.customerId);
  const what = t.type==='sale' ? ('عملية بيع '+nf(t.units)+' وحدة ('+nf(t.amount)+' ريال)') : ('دفعة '+nf(t.amount)+' ريال');

/* ---------- بيع ---------- */
let preCustomer = null;
let saleUnits = 30, salePrice = null, saleCustId = null, saleType='cash', salePaid=null, saleDate=null;
let saleQ='', saleLoad='', saleVeh='', saleNote='';

function selCustomerHtml(id, mode){
  const c = cust(id); if(!c) return '';
  const t = totalsOf(id);
  const change = mode==='pay'
    ? `preCustomer=null;saleQ='';renderPayment()`
    : `saleCustId=null;salePrice=null;saleQ='';renderSale()`;
  return `<div class="list-item" style="border-bottom:0;padding:6px 0">
      <div class="avatar">${esc((c.name||'؟').trim().charAt(0))}</div>
      <div class="li-main"><div class="li-name">${esc(c.name)}</div>
        <div class="li-sub">${nf(t.units)} وحدة · مدفوع ${nf(t.paid)}${specialPriceOf(id)? ' · <b style="color:var(--good)">سعر خاص '+nf(specialPriceOf(id))+'</b>':''}</div></div>
      <div class="li-amt">${pillFor(t.due)}</div>
    </div>
    <button class="btn alt no-print" style="margin-top:2px" onclick="${change}">تغيير العميل / عميل آخر</button>`;
}

function renderSale(){
  setHead('بيع وحدة','تسجيل عملية بيع ماء');
  if(saleDate===null) saleDate = today();
  // عميل محفوظ من جلسة سابقة قد يكون محذوفاً، أو أن القادم من شاشة عميل آخر يجب أن يفوز
  if(saleCustId && !cust(saleCustId)) saleCustId = null;
  if(preCustomer){ saleCustId = preCustomer; preCustomer = null; salePrice = null; }
  // السعر الخاص للعميل (إن وُجد) هو الافتراضي في هذه الفاتورة
  const sp = specialPriceOf(saleCustId);
  if(salePrice===null) salePrice = sp>0? sp : S.settings.unitPrice;
  const unit = Number(salePrice)||0, units = Number(saleUnits)||0;
  const total = unit*units;
  const paid = salePaid===null ? (saleType==='cash'? total : 0) : Number(salePaid)||0;

  const tiers = (S.settings.tiers||DEFAULT_TIERS).map(n=>{
    const amt = n*unit;
    return `<button class="chip" onclick="saleUnits=${n};salePaid=null;renderSale()">${n} وحدة<br><span class="tiny">${nf(amt)}</span></button>`;
  }).join('');

  const custBlock = saleCustId ? selCustomerHtml(saleCustId,'sale') : `
    <input id="saleQ" placeholder="🔍 اكتب اسم العميل أو رقم جواله" value="${esc(saleQ)}"
      oninput="saleQ=this.value;fillPick('sale')">
    <div class="m-pick" id="saleList">${pickList(saleQ,'sale')}</div>
    ${S.customers.length? '<div class="tiny" style="margin-top:8px">أو عميل جديد:</div>':''}
    <label>اسم العميل الجديد</label>
    <input id="newName" placeholder="مثال: محمد خام">
    <label>جوال العميل الجديد (اختياري)</label>
    <input id="newPhone" placeholder="7xxxxxxx" inputmode="tel">`;

  document.getElementById('app').innerHTML = `
  ${backLink()}
  <div class="card">
    <label>العميل</label>
    ${custBlock}
    <label>التاريخ</label>
    <input type="date" id="saleDate" value="${esc(saleDate)}" onchange="saleDate=this.value">
    <label>عدد الوحدات</label>
    <input id="units" type="number" inputmode="numeric" value="${units}" oninput="saleUnits=this.value; salePaid=null; softRecalc()">
    <div class="chips">${tiers}</div>
    <label>سعر الوحدة (ريال)</label>
    <input id="price" type="number" inputmode="numeric" value="${unit}" oninput="salePrice=this.value; salePaid=null; softRecalc()">
    ${sp>0? `<div class="tiny" style="margin-top:5px;color:var(--good)">💧 سعر خاص لـ ${esc((cust(saleCustId)||{}).name||'')}: ${money(sp)} للوحدة — تقدر تغيّره لهذه الفاتورة فقط.</div>`:''}
    <label>نوع البيع</label>
    <select id="stype" onchange="saleType=this.value; salePaid=null; softRecalc()">
      <option value="cash" ${saleType==='cash'?'selected':''}>نقد (دفع كامل)</option>
      <option value="credit" ${saleType==='credit'?'selected':''}>آجل (دين)</option>
      <option value="partial" ${saleType==='partial'?'selected':''}>دفعة جزئية</option>
      <option value="prev" ${saleType==='prev'?'selected':''}>دفعة من حساب سابق</option>
    </select>
    <label>المدفوع الآن (ريال)</label>
    <input id="paid" type="number" inputmode="numeric" value="${paid}" oninput="salePaid=this.value; softRecalc()">
    <label>رقم الحمولة (اختياري)</label>
    <input id="sload" value="${esc(saleLoad)}" placeholder="مثال: 12" oninput="saleLoad=this.value">
    <label>السائق / السيارة (اختياري)</label>
    <input id="sveh" value="${esc(saleVeh)}" placeholder="مثال: أبو أحمد · 1234" oninput="saleVeh=this.value">
    <label>ملاحظة (اختياري)</label>
    <input id="snote" value="${esc(saleNote)}" placeholder="مثال: توصيل، ..." oninput="saleNote=this.value">
    <div class="mini-box">
      <div class="row between"><span class="mut">الإجمالي</span><b id="totOut" style="font-size:18px">${money(total)}</b></div>
      <div class="row between" style="margin-top:4px"><span class="mut">المتبقي كدين</span><b id="dueOut" style="color:var(--bad)">${money(Math.max(0,total-paid))}</b></div>
    </div>
    <button class="btn" onclick="saveSale()">حفظ عملية البيع ✅</button>
    <button class="btn alt" onclick="location.hash='#/dashboard'">رجوع للوحة</button>
  </div>`;
}
function softRecalc(){
  const unit = Number(document.getElementById('price').value)||0;
  const units = Number(document.getElementById('units').value)||0;
  const total = unit*units;
  const type = document.getElementById('stype').value;
  const paidEl = document.getElementById('paid');
  if(type==='cash'){ paidEl.value = total; salePaid = null; }
  if(type==='credit'){ paidEl.value = 0; salePaid = null; }
  const paid = Number(document.getElementById('paid').value)||0;
  document.getElementById('totOut').textContent = money(total);
  document.getElementById('dueOut').textContent = money(Math.max(0,total-paid));
}
function saveSale(){
  let customerId = saleCustId;
  if(!customerId){
    const nmEl = document.getElementById('newName');
    const nm = ((nmEl && nmEl.value)||'').trim();
    if(!nm){ toast('اختر عميلاً أو اكتب اسم عميل جديد'); return; }
    const phEl = document.getElementById('newPhone');
    const c = {id:uid(), name:nm, phone:((phEl && phEl.value)||'').trim(), createdAt:Date.now()};
    S.customers.push(c); customerId = c.id;
  }
  const units = Number(document.getElementById('units').value)||0;
  const unitPrice = Number(document.getElementById('price').value)||0;
  const date = document.getElementById('saleDate').value || today();
  const type = document.getElementById('stype').value;
  const amount = units*unitPrice;
  const paid = Number(document.getElementById('paid').value)||0;
  if(units<=0){ toast('عدد الوحدات غير صحيح'); return; }
  if(unitPrice<=0){ toast('سعر الوحدة غير صحيح'); return; }
  if(paid>amount+0.001){ toast('المدفوع أكبر من الإجمالي'); return; }
  const gv = (id, st)=>{ const el=document.getElementById(id); return (el && el.value!==undefined && el.value!==null && el.value!=='') ? String(el.value).trim() : String(st||''); };
  S.tx.push({ id:uid(), customerId, type:'sale', date, units, unitPrice, amount, paid,
    saleType:type, note:gv('snote', saleNote),
    loadNo:gv('sload', saleLoad),
    vehicle:gv('sveh', saleVeh), created:Date.now() });
  // لا نغيّر سعر الوحدة العام إذا كان لهذا العميل سعر خاص متفق عليه
  if(!specialPriceOf(customerId)) S.settings.unitPrice = unitPrice;
  save(); toast('تم تسجيل البيع ✅');
  saleUnits=30; salePrice=null; salePaid=null; saleCustId=null; preCustomer=null; saleDate=null;
  saleQ=''; saleLoad=''; saleVeh=''; saleNote='';
  location.hash = '#/customer/'+customerId;
  route();
}

  S.tx.push({ id:uid(), customerId, type:'payment', date:document.getElementById('pdate').value||today(),

    note:document.getElementById('pnote').value.trim(), created:Date.now() });

/* ---------- كشف حساب للطبع ----------
   ملاحظة مهمة: داخل تطبيق الأندرويد لا تعمل نافذة جديدة (window.open محوَّلة إلى تنقّل
   عادي) ولا window.print() نفسها. لذلك الكشف يُعرض داخل التطبيق على مسار #/print/<id>
   ثم يُطبع عبر جسر الغلاف MaaiNative.printPage() (مدير الطباعة → حفظ PDF أو طابعة)،
   وفي المتصفح نستخدم window.print(). */
function printStatement(id){ location.hash = '#/print/'+id; }
function doPrint(){
  const nat = window.MaaiNative;
  if(nat && nat.printPage){
    try{ nat.printPage(); toast('اختر الطابعة أو «حفظ كـ PDF»'); return; }catch(e){}
  }
  try{ window.print(); return; }catch(e){}
  toast('الطباعة غير متاحة — استخدم تصدير إكسل أو انسخ الكشف');
}
function renderPrintStatement(id){
  const c = cust(id);
  if(!c){ location.hash='#/customers'; return; }
  setHead('كشف حساب للطباعة', (S.settings.businessName||'')+' · '+today());
  const t = totalsOf(id);
  const list = txOf(id);
  let run=0;
  const rows = list.map(x=>{
    const isSale = x.type==='sale';
    if(isSale){ run += Number(x.amount)||0; run -= Number(x.paid)||0; } else { run -= Number(x.amount)||0; }
    return `<tr><td>${esc(x.date)}</td><td>${isSale?'بيع '+nf(x.units)+' وحدة'+(x.loadNo?' · حمولة '+esc(x.loadNo):''):'تحصيل'}</td>
      <td>${isSale? nf(x.amount):'—'}</td><td>${nf(x.paid)}</td><td style="font-weight:800">${nf(run)}</td></tr>`;

/* ---------- تصدير التقرير المعروض ملف CSV (إكسل) ---------- */
function csvCell(v){ const s = String(v==null?'':v); return '"' + s.replace(/"/g,'""') + '"'; }
function csvText(rows){ return '\ufeff' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n'); }
function reportCsvRows(){
  const R = [];
  if(repTab==='balances'){
    R.push(['العميل','حمولات','وحدات','إجمالي','مدفوع','الباقي','أقدم دين (يوم)']);
    S.customers.slice().sort((a,b)=>dueOf(b.id)-dueOf(a.id)).forEach(c=>{
      const t = totalsOf(c.id), ag = agingOf(c.id);
      R.push([c.name, t.loads, t.units, t.sales, t.paid, t.due, ag.days===null? '' : ag.days]);
    });
  } else if(repTab==='loads'){
    R.push(['التاريخ','الحمولة','العميل','السائق/السيارة','وحدات','سعر الوحدة','الإجمالي','مدفوع','الباقي']);
    rangeTx().filter(t=>t.type==='sale').sort((a,b)=> a.date<b.date?1:-1).forEach(t=>{
      const c = cust(t.customerId);
      R.push([t.date, t.loadNo||'', c? c.name : '', t.vehicle||'', t.units, t.unitPrice, t.amount, t.paid,
        (Number(t.amount)||0)-(Number(t.paid)||0)]);
    });
  } else if(repTab==='drivers'){
    R.push(['السائق / السيارة','حمولات','وحدات','مبيعات','محصَّل','الباقي']);
    driversList().forEach(d=> R.push([d.name, d.loads, d.units, d.sales, d.total, d.left]));
  } else if(repTab==='sales'){
    R.push(['التاريخ','العميل','وحدات','سعر الوحدة','الإجمالي','مدفوع','الباقي']);
    rangeTx().filter(t=>t.type==='sale').sort((a,b)=> a.date<b.date?1:-1).forEach(t=>{
      const c = cust(t.customerId);
      R.push([t.date, c? c.name : '', t.units, t.unitPrice, t.amount, t.paid, (Number(t.amount)||0)-(Number(t.paid)||0)]);
    });
  } else if(repTab==='collect'){
    R.push(['التاريخ','العميل','البيان','السائق','المبلغ']);
    rangeTx().filter(t=>t.type==='payment'||(t.type==='sale'&&Number(t.paid)>0)).sort((a,b)=> a.date<b.date?1:-1).forEach(t=>{
      const c = cust(t.customerId);
      R.push([t.date, c? c.name : '', t.type==='payment'? 'دفعة' : 'دفعة مع بيع',
        (t.type==='payment'? t.driver : t.vehicle)||'',
        t.type==='payment'? Number(t.amount) : Number(t.paid)]);
    });
  } else if(repTab==='expenses'){
    R.push(['التاريخ','البند','ملاحظة','المبلغ']);
    rangeExp().forEach(e=> R.push([e.date, e.cat||'', e.note||'', e.amount]));
  } else if(repTab==='months'){
    R.push(['الشهر','حمولات','وحدات','مبيعات','محصَّل','مصروفات','الصافي','غير مسدد']);
    monthsList().forEach(m=> R.push([monthLabel(m.key), m.loads, m.units, m.sales, m.paid, m.expenses, m.net, m.due]));
  } else if(repTab==='analytics'){
    const g = grand();
    R.push(['المؤشر','القيمة']);
    R.push(['عدد العملاء', g.customers]);
    R.push(['الوحدات المباعة', g.units]);
    R.push(['عدد الحمولات', g.loads]);
    R.push(['إجمالي المبيعات', g.sales]);
    R.push(['المحصَّل', g.paid]);
    R.push(['المتبقي', g.due]);
    R.push(['المصروفات', g.expenses]);
    R.push(['الصافي النقدي', g.net]);
    R.push(['نسبة التحصيل %', g.sales? Math.round(g.paid/g.sales*100) : 0]);
    monthsList().forEach(m=> R.push([monthLabel(m.key), m.sales]));
  } else {
    R.push(['العميل','الجوال','وحدات','إجمالي','مدفوع','الباقي','أقدم دين (يوم)','متأخر +30','متأخر +60']);
    debtorsList().forEach(x=>{
      const ag = agingOf(x.c.id);
      R.push([x.c.name, fmtPhone(x.c.phone), x.t.units, x.t.sales, x.t.paid, x.t.due,
        ag.days===null? '' : ag.days, ag.over30, ag.over60]);
    });
  }
  return R;
}
function exportCsv(){
  const name = 'maai-' + repTab + '-' + today() + '.csv';
  const csv = csvText(reportCsvRows());
  const nat = window.MaaiNative;
  if(nat && nat.shareFile){
    try{ nat.shareFile(name, csv, 'text/csv'); toast('اختر واتساب أو «حفظ في الملفات»'); return; }catch(e){}
  }
  try{
    const blob = new Blob([csv], {type:'text/csv'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('تم تصدير الملف');
  }catch(e){ copyText(csv, 'تم نسخ التقرير نصاً'); }
}

function saveSettings(){
  S.settings.businessName = document.getElementById('sBiz').value.trim()||'مائي | MA2I';
  S.settings.owner = document.getElementById('sOwn').value.trim();
  S.settings.unitPrice = Number(document.getElementById('sPrice').value)||800;

  S.settings.tiers = tiers.length? tiers : DEFAULT_TIERS.slice();
  const th = document.getElementById('sTheme');
  S.settings.theme = (th && th.value==='light')? 'light' : 'dark';
  const gl = document.getElementById('sGoal');
  S.settings.monthGoal = Math.max(0, Number(gl && gl.value)||0);
  save(); applyTheme(); toast('تم حفظ الإعدادات ✅'); location.hash='#/dashboard';
}
function savePin(){
  const el = document.getElementById('sPin');
  const v = String((el && el.value) || '').trim();
  if(!v){ toast('اكتب الرقم السري أولاً'); return; }
  if(v.length<4){ toast('الرقم السري ٤ أرقام على الأقل'); return; }
  S.settings.pin = pinHash(v); save();
  toast('تم تفعيل القفل 🔒 — يُطلب عند فتح التطبيق');
  renderSettings();
}
function backupJson(){ return JSON.stringify(S, null, 2); }
function backupName(){ return 'maai-backup-' + today() + '.json'; }
/* النسخة الاحتياطية: على الهاتف تُشارَك (واتساب/ملف) عبر الغلاف، وفي المتصفح تُنزَّل كملف،
   وإن تعذّر الاثنان تُنسخ نصاً للحافظة. */
function exportData(){
  const json = backupJson(), name = backupName();
  S.settings.lastBackup = today(); save();
  const nat = window.MaaiNative;
  if(nat){
    try{
      if(nat.shareBackup){ nat.shareBackup(name, json); toast('اختر واتساب أو «حفظ في الملفات» لحفظ النسخة'); return; }
      if(nat.shareText){ nat.shareText(name, json); toast('اختر واتساب لحفظ النسخة'); return; }
    }catch(e){}
  }
  try{
    const blob = new Blob([json], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('تم تصدير النسخة');
  }catch(e){ copyText(json, 'تم نسخ النسخة الاحتياطية نصاً — الصقها واحفظها'); }
}
function copyBackup(){ copyText(backupJson(), 'تم نسخ النسخة الاحتياطية — الصقها في واتساب أو ملاحظة واحفظها'); }
function importData(){
  const input = document.getElementById('imp');
  const v = input ? input.value.trim() : '';
  if(!v){ toast('الصق محتوى الملف أولاً'); return; }
  const keepPin = S.settings && S.settings.pin;
  const previous = S, previousError = storageError;
  try{
    S = normalize(JSON.parse(v));
    if(keepPin) S.settings.pin = keepPin;
    storageError = '';
    if(!save()){ S=previous; storageError=previousError; return; }
    toast('تم الاستيراد ✅'); location.hash='#/dashboard'; route();
  }
  catch(e){ S=previous; storageError=previousError; toast('الملف غير صالح أو تعذر حفظه'); }
}

  openConfirm('حذف كل البيانات', 'سيتم حذف العملاء والحركات والمصروفات نهائياً. لا يمكن التراجع. تأكد أنك أخذت نسخة احتياطية.', ()=>{
    S.customers=[]; S.tx=[]; S.expenses=[]; save(); toast('تم حذف البيانات'); location.hash='#/dashboard'; route();

}
